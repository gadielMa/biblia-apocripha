<div class="controls">
  <input class="search-box" id="search" type="search" placeholder="Buscar en libros, textos y todas las secciones…"
    aria-label="Buscar en libros, textos y secciones de la biblioteca">
</div>

<section class="text-results" id="text-results" hidden aria-live="polite">
  <h2>Resultados en la biblioteca</h2>
  <div id="text-results-content"></div>
</section>

<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th data-col="Nombre">Nombre <span class="sort-arrow">↕</span></th>
        <th data-col="Resumen">Resumen <span class="sort-arrow">↕</span></th>
        <th data-col="Grupo">Grupo <span class="sort-arrow">↕</span></th>
        <th data-col="Fecha aproximada">Fecha <span class="sort-arrow">↕</span></th>
        <th data-col="Idioma original">Idioma <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No hay resultados para esta búsqueda.</div>
</div>
