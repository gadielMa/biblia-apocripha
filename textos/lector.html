<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8d5f35">
  <title>Lector · Biblioteca Bíblica Universal</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { --paper:#fffaf2; --ink:#3d2d22; --soft:#7f6753; --accent:#8d5f35; --border:#dcc6aa; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5eadb; color:var(--ink); font:17px/1.65 Georgia, serif; }
    header, main { max-width:900px; margin:auto; }
    header { max-width:none; padding:1.5rem 1rem 1.8rem; text-align:center; background:linear-gradient(135deg, rgba(255,250,242,.98), rgba(239,221,197,.96)); border-bottom:1px solid var(--border); box-shadow:0 10px 30px rgba(93,61,33,.08); }
    .header-inner { max-width:1120px; margin:auto; }
    .reader-tools { display:flex; align-items:center; justify-content:space-between; gap:1rem; max-width:1120px; margin:auto; }
    header a { color:var(--accent); text-decoration:none; font-size:.9rem; }
    .reader-search { width:min(280px, 45vw); min-height:36px; padding:.45rem .7rem; border:1px solid var(--border); border-radius:6px; background:#fffdf8; color:var(--ink); font:inherit; font-size:.82rem; }
    .reader-search-status { color:var(--soft); font-size:.78rem; min-height:1.2em; margin:.5rem 0 0; }
    h1 { font-size:clamp(1.7rem,5vw,2.5rem); margin:.7rem 0 .15rem; }
    .meta { color:var(--soft); font-size:.88rem; }
    .language-switch { display:flex; justify-content:center; gap:.5rem; margin-top:.9rem; }
    .language-switch a { padding:.35rem .7rem; border:1px solid var(--border); border-radius:5px; color:var(--accent); text-decoration:none; font-size:.8rem; }
    .language-switch a.active { background:var(--accent); color:#fffaf2; }
    .notice { padding:.8rem; border-left:4px solid var(--accent); background:#f0dfc8; font-size:.85rem; }
    main { width:calc(100% - 2rem); background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:clamp(1rem,5vw,3rem); margin:0 auto 3rem; }
    section { scroll-margin-top:1rem; margin:0 0 2.5rem; }
    h2 { color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:.35rem; }
    p { margin:0 0 1rem; }
    .verse-number { color:var(--accent); font-size:.78em; font-weight:bold; margin-right:.35rem; }
    .loading, .error { color:var(--soft); }
    .passage:target { background:#fff0cf; outline:2px solid #dfbd76; border-radius:4px; padding:.25rem .4rem; margin-left:-.4rem; }
    @media (max-width:600px) { .reader-tools { align-items:stretch; flex-direction:column; } .reader-search { width:100%; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="reader-tools">
        <a href="../index.html">← Volver a la biblioteca</a>
        <input class="reader-search" id="reader-search" type="search" placeholder="Buscar en este texto…" aria-label="Buscar en este texto">
      </div>
    <h1 id="title">Cargando texto…</h1>
    <p class="meta" id="meta"></p>
    <nav class="language-switch" id="language-switch" aria-label="Idioma"></nav>
    <p class="reader-search-status" id="reader-search-status" aria-live="polite"></p>
    </div>
  </header>
  <main id="reader"><p class="loading">Cargando lectura…</p></main>
  <script>
    const params = new URLSearchParams(location.search);
    const documentId = params.get('obra');
    const requestedChapter = Number(params.get('capitulo'));
    const reader = document.getElementById('reader');
    const readerSearch = document.getElementById('reader-search');
    const readerSearchStatus = document.getElementById('reader-search-status');
    const escapeHtml = value => String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    async function loadReader() {
      try {
        const catalog = await (await fetch('catalog.json')).json();
        const requestedEntry = catalog.find(item => item.id === documentId) || catalog[0];
        const baseId = requestedEntry.id.replace(/-es$/, '');
        const variants = catalog.filter(item => item.id === baseId || item.id === `${baseId}-es`);
        const entry = requestedEntry;
        if (!entry) throw new Error('No hay textos disponibles.');
        document.getElementById('language-switch').innerHTML = variants.map(item => {
          const label = item.language === 'es' ? 'Español' : 'English';
          const active = item.id === entry.id ? ' active' : '';
          return `<a class="${active}" href="?obra=${encodeURIComponent(item.id)}" aria-current="${active ? 'page' : 'false'}">${label}</a>`;
        }).join('');
        const work = await (await fetch(entry.file)).json();
        window.document.getElementById('title').textContent = work.title;
        window.document.getElementById('meta').textContent = `${work.language.toUpperCase()} · ${work.translator} · ${work.publication}`;
        window.document.title = `${work.title} · Biblioteca Bíblica Universal`;
        const languageNotice = work.language === 'es' ? 'Texto en español.' : 'Text in English.';
        const translationNote = work.translationNote ? ` ${escapeHtml(work.translationNote)}` : '';
        reader.innerHTML = `<p class="notice">Los números con letra son divisiones editoriales para facilitar la lectura y búsqueda.</p>` + work.chapters.map(chapter => {
          const hidden = requestedChapter && chapter.number !== requestedChapter ? ' hidden' : '';
          const verses = chapter.verses || (chapter.paragraphs || []).map((text, index) => ({ number: index + 1, text }));
          return `<section id="capitulo-${chapter.number}"${hidden}><h2>${work.language === 'es' ? 'Capítulo' : 'Chapter'} ${chapter.number}</h2>${verses.map(verse => `<p class="passage" id="pasaje-${chapter.number}-${escapeHtml(verse.number)}"><sup class="verse-number">${chapter.number}:${escapeHtml(verse.number)}</sup>${escapeHtml(verse.text)}</p>`).join('')}</section>`;
        }).join('');
        if (requestedChapter) window.document.getElementById(`capitulo-${requestedChapter}`)?.removeAttribute('hidden');
        readerSearch.addEventListener('input', () => {
          const query = readerSearch.value.trim().toLocaleLowerCase();
          let matches = 0;
          reader.querySelectorAll('.passage').forEach(passage => {
            const found = !query || passage.textContent.toLocaleLowerCase().includes(query);
            passage.hidden = !found;
            if (found && query) matches++;
          });
          readerSearchStatus.textContent = query ? `${matches} coincidencia${matches === 1 ? '' : 's'}` : '';
        });
      } catch (error) {
        reader.innerHTML = `<p class="error">No se pudo cargar este texto. ${escapeHtml(error.message)}</p>`;
      }
    }
    loadReader();
  </script>
</body>
</html>
