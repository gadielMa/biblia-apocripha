<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8d5f35">
  <title>Lector · Biblioteca Bíblica Universal</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { --paper:#fffaf2; --ink:#3d2d22; --soft:#7f6753; --accent:#8d5f35; --border:#dcc6aa; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5eadb; color:var(--ink); font:17px/1.65 Georgia, serif; }
    header, main { max-width:900px; margin:auto; }
    header { max-width:none; padding:1rem 1rem 1.25rem; text-align:center; background:linear-gradient(135deg, rgba(255,250,242,.98), rgba(239,221,197,.96)); border-bottom:1px solid var(--border); box-shadow:0 10px 30px rgba(93,61,33,.08); }
    .header-inner { width:min(1120px, 100%); margin:auto; }
    .reader-tools { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:auto; }
    header a { color:var(--accent); text-decoration:none; font-size:.9rem; }
    .reader-search { width:min(280px, 45vw); min-height:36px; padding:.45rem .7rem; border:1px solid var(--border); border-radius:6px; background:#fffdf8; color:var(--ink); font:inherit; font-size:.82rem; }
    .reader-search-status { color:var(--soft); font-size:.78rem; min-height:1.2em; margin:.5rem 0 0; }
    h1 { font-size:clamp(1.7rem, 4vw, 2.2rem); color:var(--accent); font-weight:normal; margin:.8rem 0 .15rem; text-wrap:balance; }
    .meta { color:var(--soft); font-size:.9rem; font-style:italic; }
    .language-switch { display:flex; justify-content:center; gap:.5rem; margin-top:.9rem; }
    .language-switch a { padding:.35rem .7rem; border:1px solid var(--border); border-radius:5px; color:var(--accent); text-decoration:none; font-size:.8rem; }
    .language-switch a.active { background:var(--accent); color:#fffaf2; }
    .notice { padding:.8rem; border-left:4px solid var(--accent); background:#f0dfc8; font-size:.85rem; }
    main { width:calc(100% - 2rem); background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:clamp(1rem,5vw,3rem); margin:0 auto 3rem; }
    section { scroll-margin-top:1rem; margin:0 0 2.5rem; }
    h2 { color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:.35rem; }
    p { margin:0 0 1rem; }
    .verse-number { color:var(--accent); font-size:.78em; font-weight:bold; margin-right:.35rem; }
    .loading, .error { color:var(--soft); }
    .passage:target { background:#fff0cf; outline:2px solid #dfbd76; border-radius:4px; padding:.25rem .4rem; margin-left:-.4rem; }
    @media (max-width:600px) {
      header { padding:.85rem .75rem 1rem; }
      .reader-tools { gap:.55rem; }
      header a { font-size:.78rem; white-space:nowrap; }
      .reader-search { width:min(210px,52vw); min-height:34px; font-size:.78rem; }
      h1 { font-size:1.55rem; margin:.65rem 0 .1rem; }
      .meta { font-size:.8rem; }
      .language-switch { margin-top:.65rem; }
    }
    @media (max-width:380px) {
      .reader-tools { align-items:stretch; flex-direction:column; }
      .reader-search { width:100%; }
    }

    /* ── MODERN READER SKIN ── */
    :root { --paper:#ffffff; --ink:#182536; --soft:#617286; --accent:#b4532d; --border:#d7e0eb; }
    body { background:radial-gradient(circle at 10% 0%, #fff 0 18rem, transparent 40rem), linear-gradient(180deg,#f7f9fc,#edf2f8); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { background:linear-gradient(125deg,#17283f 0%,#243e5c 58%,#8f462c 140%); border:0; border-radius:0 0 30px 30px; box-shadow:0 18px 45px rgba(23,40,63,.2); color:#fff; padding:1.2rem 1rem 3rem; }
    .header-inner { width:min(1120px,100%); }
    header a { color:#dce7f3; }
    .reader-tools { max-width:1120px; }
    .reader-search { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); color:#fff; border-radius:11px; }
    .reader-search::placeholder { color:#dce7f3; }
    .reader-search:focus { outline:2px solid #f1b28d; }
    h1 { color:#fff; font-weight:750; letter-spacing:-.045em; font-family:Georgia,serif; font-size:clamp(2rem,5vw,3.4rem); }
    .meta { color:#cbd8e7; font-style:normal; }
    .language-switch a { color:#f6d8c6; border-color:rgba(255,255,255,.25); border-radius:9px; }
    .language-switch a.active { background:#fff; color:#8f462c; }
    main { width:min(980px,calc(100% - 2rem)); margin:-1.6rem auto 2rem; position:relative; border:1px solid var(--border); border-radius:18px; padding:clamp(1.2rem,5vw,3.5rem); box-shadow:0 20px 55px rgba(26,48,77,.1); }
    .notice { background:#fff4ed; border-left-color:var(--accent); border-radius:10px; color:#6b4a3b; }
    .chapter-navigation { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin:1rem 0 1.5rem; padding:.75rem; border:1px solid var(--border); border-radius:12px; background:#f7f9fc; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .chapter-navigation a, .chapter-navigation .chapter-disabled { min-height:40px; display:inline-flex; align-items:center; justify-content:center; padding:.45rem .7rem; border:1px solid var(--border); border-radius:9px; color:var(--accent); background:#fff; font-size:.82rem; font-weight:750; text-decoration:none; }
    .chapter-navigation a:hover, .chapter-navigation a:focus-visible { background:#fff1e8; outline:2px solid #efbd9f; }
    .chapter-navigation .chapter-position { color:var(--soft); font-size:.82rem; font-weight:700; text-align:center; }
    .chapter-navigation .chapter-disabled { color:#9aa5b1; background:#f1f4f7; }
    section { margin-bottom:3rem; }
    h2 { color:#9d4d2d; font-family:Georgia,serif; font-size:clamp(1.5rem,3vw,2rem); border-bottom-color:var(--border); }
    .passage { font-family:Georgia,serif; font-size:1.08rem; line-height:1.85; color:#2c3a4b; }
    .verse-number { color:var(--accent); font-family:Inter,ui-sans-serif,sans-serif; }
    .passage:target { background:#fff1e8; outline-color:#efbd9f; }
    .reader-footer { border:0; background:#17283f; color:#b8c7d8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .reader-footer .footer-flex { width:min(1120px,90%); margin:auto; padding:32px 0; display:grid; justify-items:center; gap:14px; text-align:center; font-size:.9rem; }
    .reader-footer .footer-copy { margin:0; }
    .reader-footer .footer-copy b { color:#fff; font-weight:700; }
    .reader-footer .footer-links { display:flex; justify-content:center; align-items:center; gap:18px; flex-wrap:wrap; }
    .reader-footer .footer-links a { display:inline-flex; align-items:center; gap:7px; color:inherit; text-decoration:none; }
    .reader-footer .footer-links a:hover { text-decoration:underline; }
    .reader-footer .footer-links img { width:30px; height:30px; object-fit:contain; }
    @media (max-width:600px) { header { border-radius:0 0 22px 22px; padding-bottom:2.5rem; } main { width:calc(100% - 1rem); margin-top:-1rem; border-radius:14px; padding:1.15rem; } .passage { font-size:1rem; line-height:1.72; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="reader-tools">
        <a href="../index.html">← Volver a la biblioteca</a>
        <input class="reader-search" id="reader-search" type="search" placeholder="Buscar en este texto…" aria-label="Buscar en este texto">
      </div>
    <h1 id="title">Cargando texto…</h1>
    <p class="meta" id="meta"></p>
    <nav class="language-switch" id="language-switch" aria-label="Idioma"></nav>
    <p class="reader-search-status" id="reader-search-status" aria-live="polite"></p>
    </div>
  </header>
  <main id="reader"><p class="loading">Cargando lectura…</p></main>
  <script>
    const params = new URLSearchParams(location.search);
    const routeParts = location.pathname.split('/').filter(Boolean);
    const routeIndex = routeParts.lastIndexOf('lectura');
    const friendlyRoute = routeIndex >= 0 && routeParts[routeIndex + 1] ? routeParts[routeIndex + 1] : '';
    const friendlyReader = routeIndex >= 0;
    const documentId = params.get('obra') || friendlyRoute;
    const assetPrefix = friendlyReader ? (friendlyRoute ? '../../textos/' : '../textos/') : '';
    const homeHref = friendlyReader ? (friendlyRoute ? '../../index.html' : '../index.html') : '../index.html';
    const requestedChapter = Number(params.get('capitulo'));
    const reader = document.getElementById('reader');
    const readerSearch = document.getElementById('reader-search');
    const readerSearchStatus = document.getElementById('reader-search-status');
    const escapeHtml = value => String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    async function loadReader() {
      try {
        const catalog = await (await fetch(`${assetPrefix}catalog.json`)).json();
        const requestedEntry = catalog.find(item => item.id === documentId) || catalog[0];
        const baseId = requestedEntry.id.replace(/-es$/, '');
        const variants = catalog.filter(item => item.id === baseId || item.id === `${baseId}-es`);
        const entry = requestedEntry;
        if (!entry) throw new Error('No hay textos disponibles.');
        document.getElementById('language-switch').innerHTML = variants.map(item => {
          const label = item.language === 'es' ? 'Español' : 'English';
          const active = item.id === entry.id ? ' active' : '';
          const href = friendlyReader ? (friendlyRoute ? `../${encodeURIComponent(item.id)}/` : `?obra=${encodeURIComponent(item.id)}`) : `?obra=${encodeURIComponent(item.id)}`;
          return `<a class="${active}" href="${href}" aria-current="${active ? 'page' : 'false'}">${label}</a>`;
        }).join('');
        const work = await (await fetch(`${assetPrefix}${entry.file}`)).json();
        const currentChapterIndex = work.chapters.findIndex(chapter => Number(chapter.number) === requestedChapter);
        const gospelAndActsOrder = ['rvr1909-mateo', 'rvr1909-marcos', 'rvr1909-lucas', 'rvr1909-juan', 'rvr1909-hechos'];
        const bookPosition = gospelAndActsOrder.indexOf(entry.id);
        const previousBook = bookPosition > 0 ? catalog.find(item => item.id === gospelAndActsOrder[bookPosition - 1]) : null;
        const nextBook = bookPosition >= 0 && bookPosition < gospelAndActsOrder.length - 1
          ? catalog.find(item => item.id === gospelAndActsOrder[bookPosition + 1])
          : null;
        const chapterNavigation = currentChapterIndex < 0 ? '' : await (async () => {
          const chapterUrl = chapterNumber => {
            const url = new URL(window.location.href);
            url.searchParams.set('obra', entry.id);
            url.searchParams.set('capitulo', chapterNumber);
            url.hash = '';
            return `${url.pathname}${url.search}`;
          };
          const adjacentBookUrl = (book, chapterNumber) => friendlyReader && friendlyRoute
            ? `../${encodeURIComponent(book.id)}/?capitulo=${chapterNumber}`
            : (() => {
              const url = new URL(window.location.href);
              url.searchParams.set('obra', book.id);
              url.searchParams.set('capitulo', chapterNumber);
              url.hash = '';
              return `${url.pathname}${url.search}`;
            })();
          let previousTarget = currentChapterIndex > 0
            ? { book: entry, chapter: work.chapters[currentChapterIndex - 1].number }
            : null;
          if (!previousTarget && currentChapterIndex === 0 && previousBook) {
            const previousWork = await (await fetch(`${assetPrefix}${previousBook.file}`)).json();
            previousTarget = { book: previousBook, chapter: previousWork.chapters.at(-1).number };
          }
          const nextTarget = currentChapterIndex < work.chapters.length - 1
            ? { book: entry, chapter: work.chapters[currentChapterIndex + 1].number }
            : nextBook ? { book: nextBook, chapter: 1 } : null;
          const bookLabel = book => book.title.replace(/ \(Reina-Valera 1909\)$/, '');
          const previousLabel = previousTarget?.book.id === entry.id
            ? '← Anterior'
            : previousTarget ? `← ${bookLabel(previousTarget.book)} ${previousTarget.chapter}` : '';
          const nextLabel = nextTarget?.book.id === entry.id
            ? 'Siguiente →'
            : nextTarget ? `${bookLabel(nextTarget.book)} ${nextTarget.chapter} →` : '';
          const previousLink = previousTarget
            ? `<a href="${escapeHtml(previousTarget.book.id === entry.id ? chapterUrl(previousTarget.chapter) : adjacentBookUrl(previousTarget.book, previousTarget.chapter))}" rel="prev">${previousLabel}</a>`
            : '<span class="chapter-disabled" aria-disabled="true">← Anterior</span>';
          const nextLink = nextTarget
            ? `<a href="${escapeHtml(nextTarget.book.id === entry.id ? chapterUrl(nextTarget.chapter) : adjacentBookUrl(nextTarget.book, nextTarget.chapter))}" rel="next">${nextLabel}</a>`
            : '<span class="chapter-disabled" aria-disabled="true">Siguiente →</span>';
          return `<nav class="chapter-navigation" aria-label="Navegación de capítulos">${previousLink}<span class="chapter-position">Capítulo ${escapeHtml(work.chapters[currentChapterIndex].number)} de ${work.chapters.length}</span>${nextLink}</nav>`;
        })();
        const backLink = document.querySelector('.reader-tools a');
        const footerHome = document.getElementById('footer-home');
        if (backLink) backLink.href = homeHref;
        if (footerHome) footerHome.href = homeHref;
        window.document.getElementById('title').textContent = work.title;
        const languageLabel = work.language === 'es' ? 'Español' : 'English';
        const sourceTranslator = work.sourceTranslator || (work.language === 'es' ? '' : work.translator);
        window.document.getElementById('meta').textContent = [languageLabel, sourceTranslator, work.publication]
          .filter(Boolean).join(' · ');
        window.document.title = `${work.title} · Biblioteca Bíblica Universal`;
        reader.innerHTML = `<p class="notice">Los números con letra son divisiones editoriales para facilitar la lectura y búsqueda.</p>` + chapterNavigation + work.chapters.map(chapter => {
          const hidden = requestedChapter && chapter.number !== requestedChapter ? ' hidden' : '';
          const verses = chapter.verses || (chapter.paragraphs || []).map((text, index) => ({ number: index + 1, text }));
          return `<section id="capitulo-${chapter.number}"${hidden}><h2>${work.language === 'es' ? 'Capítulo' : 'Chapter'} ${chapter.number}</h2>${verses.map(verse => `<p class="passage" id="pasaje-${chapter.number}-${escapeHtml(verse.number)}"><sup class="verse-number">${chapter.number}:${escapeHtml(verse.number)}</sup>${escapeHtml(verse.text)}</p>`).join('')}</section>`;
        }).join('') + chapterNavigation;
        if (requestedChapter) window.document.getElementById(`capitulo-${requestedChapter}`)?.removeAttribute('hidden');
        readerSearch.addEventListener('input', () => {
          const query = readerSearch.value.trim().toLocaleLowerCase();
          let matches = 0;
          reader.querySelectorAll('.passage').forEach(passage => {
            const found = !query || passage.textContent.toLocaleLowerCase().includes(query);
            passage.hidden = !found;
            if (found && query) matches++;
          });
          readerSearchStatus.textContent = query ? `${matches} coincidencia${matches === 1 ? '' : 's'}` : '';
        });
      } catch (error) {
        reader.innerHTML = `<p class="error">No se pudo cargar este texto. ${escapeHtml(error.message)}</p>`;
      }
    }
    loadReader();
  </script>
  <footer class="reader-footer">
    <div class="footer-flex">
      <p class="footer-copy">© 2026 <b>Induliru</b>. Innovación | Calidad | Desarrollo. Todos los derechos reservados.</p>

        <a href="https://www.instagram.com/induliru.tech/" target="_blank" rel="noopener"><img src="https://induliru.com/INSTA_LOGO.png" alt="Instagram">@induliru.tech</a>
        <a href="mailto:hola@induliru.com"><img src="https://induliru.com/GMAIL_LOGO.png" alt="Email">hola@induliru.com</a>
      </div>
    </div>
  </footer>
</body>
</html>
